server {
    listen 80;

    # ===== HEALTH CHECK (MANDATORY FOR BEANSTALK) =====
    location = / {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # ===== ADMIN SERVICE =====
    location /admin/ {
        proxy_pass http://admin:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== DESIGN SERVICE =====
    location /design/ {
        proxy_pass http://design:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
