events {}

http {

  server {
      listen 80;

      # health check
      location = / {
          return 200 "OK";
          add_header Content-Type text/plain;
      }

      location /admin/ {
          proxy_pass http://admin:3000/;
      }

      location /design/ {
          proxy_pass http://design:3000/;
      }
  }

}
