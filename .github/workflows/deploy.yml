name: Deploy Frontend-A Demo

on:
  push:
    branches: develop-live

env:
  AWS_REGION: ap-south-1
  ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  VERSION: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        run: |
          aws ecr get-login-password \
          | docker login --username AWS --password-stdin $ECR

      - name: Build admin
        run: |
          docker build -t $ECR/fe-admin:$VERSION services/fe-admin
          docker push $ECR/fe-admin:$VERSION

      - name: Build design
        run: |
          docker build -t $ECR/fe-design:$VERSION services/fe-design
          docker push $ECR/fe-design:$VERSION

      - name: Inject tag
        run: |
          sed -i "s/\${TAG}/$VERSION/g" environments/frontend-a/docker-compose.yml

      - name: Zip
        run: |
          cd environments/frontend-a
          zip -r app.zip .

      - name: Upload bundle
        run: |
          aws s3 cp environments/frontend-a/app.zip \
          s3://elasticbeanstalk-$AWS_REGION-$ACCOUNT_ID/frontend-a-$VERSION.zip

      - name: Create version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name frontend-app \
            --version-label $VERSION \
            --source-bundle S3Bucket=elasticbeanstalk-$AWS_REGION-$ACCOUNT_ID,S3Key=frontend-a-$VERSION.zip

      - name: Deploy
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name frontend-a-env \
            --version-label $VERSION
